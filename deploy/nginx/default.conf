# 反代到 app 服务（uvicorn，容器内部 8230）。默认 HTTP-only：证书是客户自己
# 的资产，不该在这里预置一个假设存在的路径导致 nginx 直接拒绝启动；需要 TLS
# 时按 docker-compose.yml 里的注释挂真实证书 + 补 443 server 块。
#
# 与 docs/deploy-two-servers.md 里 A 上那套 snippet（mjagent2-proxy.conf /
# mjagent2-app.conf / mjagent2-websocket.conf）职责一致，为容器化交付重新写成
# 单文件版本：Host/X-Forwarded-* 透传、WebSocket Upgrade、SSE 长连接关缓冲。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream manju_app {
    server app:8230;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 200m;

    location / {
        proxy_pass http://manju_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SSE（/api/agent/turns/{id}/events 等）：必须关缓冲，否则事件会被 nginx
    # 攒批，前端拿到的不是逐条实时流；读超时按分镜/长对话真实观察值放宽。
    location ~ ^/api/.*/events$ {
        proxy_pass http://manju_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1200s;
    }

    # /media：后端自己按 Cache-Control: private 签发，这里只需要透传响应头，
    # 不额外覆盖——nginx 默认原样转发上游响应头。
    location /media/ {
        proxy_pass http://manju_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
