<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>漫剧 · 案头</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='8' fill='%23b54434'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23f7f2e7' font-family='serif'%3E漫%3C/text%3E%3C/svg%3E" />
    <script>
      // 防白闪：React 挂载前就把 data-theme 写好，否则夜里刷新会先闪一屏宣纸白。
      // 这段是 src/theme/theme.ts 的最小复制，改时段/键名要两边一起改
      // （src/theme/theme.test.ts 会读本文件校验，改漏了测试会红）。
      (function () {
        try {
          var mode = window.localStorage.getItem('manju:theme-mode');
          if (mode !== 'light' && mode !== 'dark' && mode !== 'auto') mode = 'auto';
          var hour = new Date().getHours();
          var theme = mode === 'auto' ? (hour >= 22 || hour < 8 ? 'dark' : 'light') : mode;
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (err) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
