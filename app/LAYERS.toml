# ============================================================================
# 以下是 2026-08-29 补齐的 115 个此前未声明层号的模块（拆包产生的新子模块 +
# 一批本来就存在、但从未被本文件覆盖的顶层模块）。层号判据：
#
#   1. 零 app 内部依赖（AST 解析出的 import 边完全不落在 app.* 里）的纯值对象/
#      纯函数模块 -> L1（例如 app.scene_contract、app.harness.types、
#      app.identity_authority、app.character_policy、app.textmatch）。不用 L0，
#      把 L0「契约内核」保留给 schemas/errors/contracts 那三个已声明的核心文件，
#      避免这一层的语义被冲淡。
#   2. 依赖只落在 L0-L2 的模块 -> 按其消费方所在的层就近定档（L2 持久化 / L3
#      供应商适配 / L4 领域能力），不机械套用某个固定档位——例如
#      app.model_registry/app.model_runtime_profile 只依赖 db，但被
#      app.hiagent(L3) 依赖，定 L3；app.model_migration 同样只依赖 db，但角色是
#      db 迁移脚本，定 L2（持久化家族）。
#   3. 消费方全部是 L4/L5 的模块 -> 定 L4（领域能力），这是绝大多数拆包子模块的
#      情况：app.screenplay_scene_shards.*（screenplay_scene_shards 是耦合审查
#      点名的 6472 行巨模块之一，拆包后与 app.production.screenplay_repair /
#      app.screenplay_ir 同档）、app.narrative_blueprint/outline/priority/repair
#      （app.narrative 的同名族但不共享包前缀，dot-boundary 不会误吃）、
#      app.video_*、app.storyboard_*、app.multiview/refs/scenes/continuity/
#      compiler/completion_grant 等——它们互相依赖、也依赖 stages/portraits/
#      validators/production，天然是同一档。
#   4. 消费方专属于某个已声明 L5 家族、且自身也直接 import 该家族 -> L5：
#      app.agent.*（AI 操作代理，唯一消费方是 app.main，自身 import
#      app.capabilities.*）、app.mcp.*（MCP 工具服务器，同样只被 app.main 消费、
#      直接 import app.capabilities/app.orchestration.api）、
#      app.system_api/app.monitoring/app.recovery/app.planning（消费方清一色是
#      L5，自身直接 import app.worker/app.capabilities.dispatch/
#      app.orchestration.api）。app.delivery/app.downstream_authority 单独判
#      L5：两者都直接 import app.domain.common 或 app.orchestration.engine，
#      且消费方全部是 L5（capabilities.handlers.delivery / main /
#      orchestration.api），没有任何 L4 消费方逼着它们必须 <=4，判 L5 后两个
#      模块自身的上行边全部消失（对照：app.storyboard_workspace 也 import
#      app.orchestration.engine，但它有 app.production.publish/
#      storyboard_pack 两个 L4 消费方逼着必须 <=4，判 L5 只会把上行边转移到那两
#      个消费方身上，所以判 L4，把这条边如实报成真实违规，见下方 max_violations
#      注释）。app.video_supervisor 同理判 L5：4487 行，直接 import app.api/
#      app.worker/app.orchestration.engine/app.orchestration.media_scheduler/
#      app.domain.storyboard_ops，且消费方清一色是 L5（capabilities.preflight/
#      domain.*/main/media_exec.*/orchestration.api/recovery），没有任何 L4
#      消费方——这点与命名相似的 app.storyboard_supervisor（有 L4 消费方，判
#      L4）不同，不是套模板，是数据决定的。
#   5. 存在真实双向耦合（互相 import，构成同一个强连通分量）的两个模块必须同层，
#      否则无论怎么声明都会有一条边被判上行：app.video_providers(已声明 L3) 与
#      app.video_prompt_profiles 互相 import，判 app.video_prompt_profiles = 3
#      （而非 fail-safe 的 5），原来「app.video_providers(L3) ->
#      app.video_prompt_profiles(L5)」这条上行边随之消失——运行时它们本来就是
#      互相依赖的同一档，不是 L3 单向依赖 L5。
#   6. app.video_modes_pkg / app.video_supervisor_pkg 是另一个 agent 正在进行的
#      拆包（app/video_modes.py、app/video_supervisor.py 仍是完整文件，两个
#      _pkg 目录暂未被任何地方 import，处于半成品状态），按其 AST 实际 import
#      的目标（multiview/scenes/portraits 等 L4，以及 video_supervisor_pkg 直
#      接 import app.api/app.worker/app.orchestration.*）分别对齐旧模块的层号
#      （4 和 5），避免这批半成品在下一次实测时又变成一批新的未声明模块。
#   7. 裸模块 "app"（app/__init__.py，无任何内容）判 L0——它是包命名空间本身，
#      不是某一层的业务代码；只声明这一个精确 key，不声明 "app" 前缀，避免它当
#      catch-all 吃掉未来任何新增但忘记声明的模块（fail-safe L5 的兜底必须继续
#      对新模块生效）。
#
# 补声明后 --check-layers 的「未声明层号的模块」从 115 降到 0；上行边总数从
# 1310（模块级 1156、延迟导入 154）降到 44（模块级 20、延迟导入 24）——降幅
# 96.6%，绝大多数是本文件之前没覆盖到这些模块造成的幻影违规，不是代码变差了。
# 剩下 44 条是否真实上行边、按什么口径分类，见上面 max_violations 的注释。
# ============================================================================

