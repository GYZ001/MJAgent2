# 豁免：每条必须带 reason 与 expires（YYYY-MM-DD），过期的豁免按违规计入总数。
# 目前没有需要豁免的边——所有现存上行边都走 max_violations 阈值收敛，不在这里
# 逐条列白名单（CLAUDE.md 禁止黑白名单式豁免；这里留空，不是漏填）。
# 需要时用数组表添加，例如：
#   [[allowed_exceptions]]
#   from = "app.db"
#   to = "app.artifacts"
#   reason = "..."
#   expires = "2026-12-31"
