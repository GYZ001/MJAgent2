# 分层声明——把 docs/architecture_layering_plan_2026-08-29.md 「2.1 声明式分层」
# 的表格变成可被 scripts/arch_graph.py --check-layers 读取的数据。
#
# 规则：
#   - 层号越小越底层。合法依赖只能指向层号更小或同层的模块（同层允许）。
#   - key 既可以是具体模块（"app.harness.model_gateway"），也可以是包前缀
#     （"app.production" 覆盖 app.production.* 的所有子模块），除非子模块本身
#     有更具体的 key 覆盖它（最长前缀匹配优先）。
#   - 没有在这里出现、也没有被任何前缀覆盖的模块按 fail-safe 规则视为 L5
#     （--check-layers 会把它们单独列出来提醒补声明，不会静默放过）。
#   - 标了「待建」的 key 对应的文件目前还不存在（方案里的目标态），提前占位是
#     为了避免将来建出来时忘记归层；在文件出现之前它们不匹配任何真实模块，无副作用。
#   - app.domain / app.media_exec / app.portraits 这类用 exec(compile(...)) 把多个
#     chunk 文件注入同一份 globals() 的聚合外观包（见各自 __init__.py 的文档字符
#     串）不在此列——运行时 chunk 和外观是同一个模块。scripts/arch_graph.py 会从
#     AST 里推导出每个外观 exec 了哪些 chunk（不认包名、只认「for 循环 + exec(
#     compile(...))」这个形状，未来新增的同类外观包会被自动识别），判层时强制按
#     外观的层号——即使将来有人误给某个具体 chunk（如 "app.portraits.discovery"）
#     单独声明了不同的层号，那条声明也会被判层逻辑忽略，因为运行时根本没有第二
#     个命名空间可以让它单独成立。这几个包因此不需要（也不应该）再为包内单个
#     chunk 文件加更具体的 key，只声明包前缀就够。（app.stages 不是这个模式——它
#     的子模块是普通的 `from .x import y` 互相引用，各自都是真实的独立模块，
#     "app.stages" 这条前缀声明只是设计选择，不是运行时强制。）

# 实测：commit 5265572，取数时 `git status --porcelain | wc -l` = 144（工作区多个
# agent 并行改 app/stages、app/portraits、app/validators、app/production/*、
# app/screenplay_scene_shards、app/video_modes_pkg、app/video_supervisor_pkg 等，
# 均未提交）。这次实测是在补齐 115 个此前未声明层号的模块（它们此前按 fail-safe
# 规则统一判 L5，把大量正常的「L4 领域能力 import L3 供应商适配」「L2 持久化 import
# L1 平台设施」误判成上行）之后取的：补声明前 --check-layers 报 1310 条上行边
# （模块级 1156、延迟导入 154，另有 115 个模块未声明层号）；补声明后剩 44 条
# （模块级 20、延迟导入 24）—— 96.6% 是声明缺口造成的幻影违规，不是真实架构倒置。
# 剩下的 44 条里，约一半（errors->db、auth.*->db、hiagent->media_pipeline.*、
# harness.model_gateway->orchestration.state_machine、portraits->orchestration.
# state_machine 等）发生在两个此前就已声明层号的模块之间，与本次补声明无关，是
# 本来就存在、只是被噪音淹没的真实上行边；另一半（artifacts->completion_grant、
# storyboard_workspace/storyboard_supervisor/production.storyboard_pack->domain、
# video_plan->domain、loops.base->orchestration.state_machine、minimax_h3/
# seedance/video_providers->video_plan 等）是本次新声明的模块自身对编排层/供应商
# 层的真实反向依赖——声明时已按「多数消费方所在层」定层，不是为了掩盖违规而调高。
# 阈值按实测 44 上浮 ~9% 留一点给并行 agent 的中间态，不做更大缓冲。红线只降不升
# ——以后每解掉一条真实上行边就把这个数字调小，不得因为再冒出新的未声明模块而调大
# （新模块应该补声明，不是垫高阈值）。
#
