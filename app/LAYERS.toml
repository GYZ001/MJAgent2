# seedance/video_providers->video_plan 等）是本次新声明的模块自身对编排层/供应商
# 层的真实反向依赖——声明时已按「多数消费方所在层」定层，不是为了掩盖违规而调高。
# 阈值按实测 44 上浮 ~9% 留一点给并行 agent 的中间态，不做更大缓冲。红线只降不升
