# 18），与 docs/layer_violations_plan_2026-08-30.md 用临时副本预测的 44→20 完全
# 吻合。阈值不采用该文档建议的 24（20+4，占实测值 20%）——那个缓冲比例与本文件
# 上面「44 上浮 ~9%」的既有口径不一致（文档里「与现有口径一致」这句话本身有算错，
# 4/20=20% 不是 9%），改用同一个 ~9% 口径对 20 取整，得 22（20+2）。红线只降不升
# ——48 已经不成立，22 是新地板；以后每解掉一条真实上行边就把这个数字继续调小。
