# 单文件形状规范——把「单个文件长什么样才算合格」变成可被
# scripts/check_file_conventions.py 读取的数据。与 app/LAYERS.toml（管「谁能依赖
# 谁」）是同类机制、不同维度，二者不重叠，参见该工具的模块 docstring。

# ---------------------------------------------------------------------------
# 阈值来源（2026-08-30 改版）：不再取本仓库自己的分位数，改用业界工具的通行默认值。
#
# 上一版把 max_lines_python 定成 600、frontend 400、单函数 200，依据是「本仓库
# 当时的中位数与 p75 之间」。那种取法有个根本问题：**仓库越烂，标准越松**——它
# 把现状当成了应然。行数本身也没有硬性的行业依据（各家默认值跨度极大：ESLint
# max-lines 300、SonarQube 750、Pylint max-module-lines 1000、Checkstyle
# FileLength 2000；学术上 Basili/Hatton/El Emam 三方结论互相打架，El Emam 更直接
# 论证「最优规模」多半是拿缺陷数除以规模造成的数学假象）。所以这里不追求「科学
# 正确的数字」，只取一个**业界共识区间内、能长期指向正确方向**的值：
#
#   max_lines_python   = 500   ESLint(300) 与 SonarQube(750) 之间；「一个模块做一件事」
#   max_lines_frontend = 300   ESLint max-lines 的默认值，前端工具链里最通行的单值
#   max_function_lines = 50    ESLint max-lines-per-function 默认值；Linux
#                              CodingStyle 的「一屏」约 24-48 行，多数风格指南 20-60
#
# 单函数维度同时改了**度量方式**：从原始跨度（end_lineno - lineno + 1）改成
# 只数代码行，剔除 docstring、空行、纯注释（见 _function_code_lines）。原来的
# 度量把文档算成复杂度，同一份逻辑写了事故复盘 docstring 的版本反而更容易撞线，
# 是在惩罚写文档——本仓库已经因为同一类反向激励删掉过整个 max_toplevel_defs_python
# 维度（它奖励焊大函数、惩罚拆分），不能再犯第二次。改成代码行后，50 这个阈值
# 也才与 ESLint（常配 skipBlankLines + skipComments）真正可比。
#
# 下面每条 baseline = **该文件当前的精确实测值**，不带任何缓冲。上一版基线是
# 并行开发期按「实测 × 1.15」取的，等并行改动落地后一直没收紧，累积出 19,256 行
# 闲置余量（极端例子：frontend MonitorPage.tsx 实测 874、基线 5250，那道闸门对它
# 形同虚设）。本次全部按实测重发，闲置余量归零。
#
# **每一条 baseline 都是欠账，不是许可。** 棘轮只降不升：拆小了就把数字调小，
# 不许为了让自己的改动过关而调大。line_count 136 条、function_lines
# 319 条，就是这个仓库距离业界通行标准还差多远的完整清单。
# ---------------------------------------------------------------------------

# 豁免：整体豁免某个文件的某个维度检查（例如确认要长期保留的生成代码）。
# 每条必须带 reason 与 expires（YYYY-MM-DD），过期的豁免按违规计入总数；缺
# reason 或 expires 的条目在加载配置时就被拒绝，不会静默生效。目前没有需要豁免
# 的文件——所有现存超标文件都走下面的 [baseline.*] 棘轮收敛，不在这里逐条列
# 白名单（CLAUDE.md 禁止黑白名单式豁免）。用法示例：
#   [[exemptions]]
#   path = "app/some_generated_file.py"
#   dimension = "line_count"
#   reason = "..."
#   expires = "2026-12-31"
# 必须放在 [defaults] 之前：TOML 里一个 section 会一直吃到下一个 section
# header，写在 [defaults] 后面的裸 key 会被并入 [defaults] 表（app/LAYERS.toml
# 已经踩过这个坑，这里照抄它的写法）。
exemptions = []

[defaults]
max_lines_python = 500
max_lines_frontend = 300
max_function_lines_python = 50

