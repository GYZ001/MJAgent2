# 单文件形状规范——把「单个文件长什么样才算合格」变成可被
# scripts/check_file_conventions.py 读取的数据。与 app/LAYERS.toml（管「谁能依赖
# 谁」）是同类机制、不同维度，二者不重叠，参见该工具的模块 docstring。

# ---------------------------------------------------------------------------
# 取数状态（棘轮基线只在这一刻的工作区快照上有意义，之后会随代码变化而需要重取）
#
#   commit: 5265572
#   git status: 59 条改动（app/ 23 个已修改 + 3 个新增，tests/ 26 个已修改 + 1 个
#     新增，scripts/arch_graph.py、scripts/verify.py 已修改）——3 个 agent 正在并行
#     改后端，此刻的行数/定义数是移动靶。
#
# 因此下面每个 baseline 数值 = 实测值 * 1.15（向上取整到 50/5/25 的整数倍），
# 不是精确实测值本身，目的是给并行编辑留出空间、避免他们收尾提交前的正常改动
# 把这道闸门误判为红。等这批并行改动落地、数字稳定后，应该用
# `--report-actuals` 重新核对，并把明显宽松的基线调紧——红线只降不升，缓冲区
# 本身不是长期免检额度。
# ---------------------------------------------------------------------------

# 豁免：整体豁免某个文件的某个维度检查（例如确认要长期保留的生成代码）。
# 每条必须带 reason 与 expires（YYYY-MM-DD），过期的豁免按违规计入总数；缺
# reason 或 expires 的条目在加载配置时就被拒绝，不会静默生效。目前没有需要豁免
# 的文件——所有现存超标文件都走下面的 [baseline.*] 棘轮收敛，不在这里逐条列
# 白名单（CLAUDE.md 禁止黑白名单式豁免）。用法示例：
#   [[exemptions]]
#   path = "app/some_generated_file.py"
#   dimension = "line_count"
#   reason = "..."
#   expires = "2026-12-31"
# 必须放在 [defaults] 之前：TOML 里一个 section 会一直吃到下一个 section
# header，写在 [defaults] 后面的裸 key 会被并入 [defaults] 表（app/LAYERS.toml
# 已经踩过这个坑，这里照抄它的写法）。
exemptions = []

[defaults]
# 对没有 baseline 记录的文件生效的紧阈值——新文件应该达到的标准，不是现状。
# 取值依据（当前 200 个 app/*.py 的行数分布：中位数 225，p75 965，p90 2914；
# 95 个 frontend/src/**/*.{ts,tsx} 中位数 95，p75 210，p90 931）：定在中位数与
# p75 之间，既不放行「新建的文件也是一坨」，也不会因为过严而误伤正常大小的新模块。
max_lines_python = 600
max_lines_frontend = 400
# 单函数最长行数分布（app/*.py 每文件最长函数）：中位数 63，p75 203，p90 493。
# `app/screenplay_ir.py::compile_screenplay_ir` 曾经 3,585 行——单文件行数本身不会
# 拦住「一个文件里只焊了一个巨型函数」（行数照样能落在合理区间），这个维度专门补
# 这个缺口。
#
# 曾有第三个维度 `max_toplevel_defs_python`（顶层定义数上限，2026-08-29 移除）：
# 对全仓库 258 个 app/*.py 实测，行数与顶层定义数相关系数 0.895，二者几乎总是
# 同涨同跌，line_count 已经在管「文件整体过大」；唯一一个只撞这道维度、不撞
# line_count/function_lines 的文件是 app/capabilities/inputs.py（47 个几行长的
# Pydantic 模型，340 行）——良好代码而非 god-module。更严重的反例：
# compile_screenplay_ir 从 3,585 行单函数拆成编排器 + ~45 个具名 helper 后，
# function_lines 大幅改善（3,585→322），但顶层定义数从 55 涨到 82 撞穿了这道
# 维度，逼着基线从 55 上调到 95——奖励焊大函数、惩罚拆分。真正的 god-module
# 信号已被 line_count（文件整体过大）与 function_lines（单个函数/方法过大，
# 用 ast.walk 遍历全树含类方法）完整覆盖，故删除整个维度而非调参。详见
# scripts/check_file_conventions.py 模块 docstring。
max_function_lines_python = 200

